name: Check README skill list

on:
  pull_request:
    paths:
      - 'skills/**'
      - 'README.md'
      - 'scripts/check-readme-skills.sh'
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify README table tracks skills/ directories
        run: bash scripts/check-readme-skills.sh
